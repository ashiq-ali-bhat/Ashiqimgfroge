<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark container background with rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#090d16" />
  
  <!-- Outer glowing accent border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#forgeGrad)" stroke-width="2.5" opacity="0.85" />
  
  <!-- Subtle ambient inner glow -->
  <circle cx="32" cy="32" r="22" fill="url(#forgeGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- Image Frame / Forge Anvil Symbolism -->
  <!-- Image Frame geometry -->
  <rect x="14" y="14" width="36" height="36" rx="8" fill="#131929" stroke="url(#forgeGrad)" stroke-width="2" />
  
  <!-- Landscape mountain peaks / forge hammer anvil shape inside frame -->
  <path d="M19 42 L28 29 L35 37 L41 31 L45 42 Z" fill="url(#forgeGrad)" opacity="0.8" />
  
  <!-- Sun / Spark element -->
  <circle cx="25" cy="22" r="3.5" fill="#fbcfe8" />
  
  <!-- Golden / Neon Sparkle Forge Star at top right -->
  <path d="M44 10 L45.5 15 L50.5 16.5 L45.5 18 L44 23 L42.5 18 L37.5 16.5 L42.5 15 Z" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="44" cy="16.5" r="1.5" fill="#ffffff" />
</svg>
